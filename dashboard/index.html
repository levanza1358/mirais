<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>Mirais</title>
    <style>
      /* Inline so the splash paints before the CSS bundle arrives. Removed by
         main.tsx once React has mounted. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #000;
        transition: opacity 320ms ease;
      }
      #boot.boot-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot img {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      #boot span {
        width: 96px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
      }
      #boot span::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #7c5cff;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.65; transform: scale(0.95); }
      }
      @keyframes boot-slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(340%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot img, #boot span::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <img src="/icon.png" alt="Mirais" />
      <span></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
